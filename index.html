<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>TaskFlow Pro</title>
  <meta name="description" content="TaskFlow Pro — Smart task management PWA with priorities, categories, and progress tracking." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TaskFlow" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f17;
      --bg2: #16161f;
      --bg3: #1e1e2a;
      --bg4: #252535;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --text: #eeeef5;
      --text2: #8888aa;
      --text3: #44445a;
      --accent: #6366f1;
      --accent-light: rgba(99,102,241,0.15);
      --green: #22c55e;
      --green-light: rgba(34,197,94,0.12);
      --amber: #f59e0b;
      --amber-light: rgba(245,158,11,0.12);
      --red: #ef4444;
      --red-light: rgba(239,68,68,0.12);
      --radius: 14px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
    }

    /* INSTALL BANNER */
    #installBanner {
      display: none;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: white;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    /* HEADER */
    header {
      padding: 20px 20px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    header.scrolled { border-color: var(--border); }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .app-name span { color: var(--accent); }

    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: var(--bg2);
      border-radius: 10px;
      color: var(--text2);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      position: relative;
    }
    .icon-btn:hover { background: var(--bg3); color: var(--text); }
    .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* PROGRESS */
    .progress-wrap {
      padding: 0 20px 16px;
    }
    .progress-bar-bg {
      height: 4px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
      width: 0%;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text3);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 6px;
    }

    /* FILTERS */
    .filters-wrap {
      padding: 0 20px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters-wrap::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: var(--bg2);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .filter-chip:hover { border-color: var(--border2); color: var(--text); }
    .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
    .filter-chip .count {
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      padding: 1px 6px;
      font-size: 10px;
    }
    .filter-chip:not(.active) .count { background: var(--bg3); }

    /* MAIN */
    main {
      flex: 1;
      padding: 0 20px 100px;
      overflow-y: auto;
    }

    /* ADD TASK */
    .add-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 20px;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: slideDown 0.2s ease;
    }
    .add-wrap.open { display: flex; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    .add-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-input:focus { border-color: var(--accent); }
    .add-input::placeholder { color: var(--text3); }

    .add-row { display: flex; gap: 8px; }

    .add-select {
      flex: 1;
      padding: 8px 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text2);
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      cursor: pointer;
    }
    .add-select:focus { border-color: var(--accent); }

    .add-btn {
      padding: 8px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .add-btn:hover { opacity: 0.85; }

    /* SECTION LABEL */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* TASK LIST */
    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s;
      animation: taskIn 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    @keyframes taskIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .task-item:hover { border-color: var(--border2); }
    .task-item.done { opacity: 0.5; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--text3); }

    /* Priority stripe */
    .task-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }
    .task-item[data-priority="high"]::before { background: var(--red); }
    .task-item[data-priority="medium"]::before { background: var(--amber); }
    .task-item[data-priority="low"]::before { background: var(--green); }

    .task-cb {
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--border2);
      cursor: pointer;
      appearance: none;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 0.15s;
      position: relative;
    }
    .task-cb:checked { background: var(--accent); border-color: var(--accent); }
    .task-cb:checked::after {
      content: '✓';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: white;
      font-size: 11px;
      font-weight: 700;
    }

    .task-body { flex: 1; min-width: 0; }
    .task-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }
    .task-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.04em;
    }
    .tag-cat {
      background: var(--accent-light);
      color: #818cf8;
    }
    .tag-high { background: var(--red-light); color: #f87171; }
    .tag-medium { background: var(--amber-light); color: #fbbf24; }
    .tag-low { background: var(--green-light); color: #4ade80; }

    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .task-action-btn {
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--text3);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .task-action-btn:hover { background: var(--bg3); color: var(--red); }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-state.show { display: flex; }
    .empty-icon { font-size: 48px; opacity: 0.3; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); }
    .empty-sub { font-size: 13px; color: var(--text3); }

    /* STATS PANEL */
    .stats-panel {
      display: none;
      padding: 0 20px 16px;
    }
    .stats-panel.open { display: block; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 24px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      display: block;
    }
    .stat-lbl { font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; display: block; }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 20px;
      width: 54px; height: 54px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 24px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(99,102,241,0.4);
      transition: all 0.2s;
      z-index: 50;
    }
    .fab:hover { transform: scale(1.08); }
    .fab.open { transform: rotate(45deg); background: var(--red); box-shadow: 0 8px 32px rgba(239,68,68,0.4); }
  </style>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</head>
<body>

<div id="installBanner" onclick="installApp()">⬇️ Install TaskFlow Pro</div>

<header id="header">
  <div class="header-top">
    <div class="app-name">Task<span>Flow</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="statsBtn" onclick="toggleStats()" title="Stats">📊</button>
      <button class="icon-btn" id="clearBtn" onclick="clearDone()" title="Clear done">🧹</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressLabel">0 / 0 tasks done</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="stats-panel" id="statsPanel">
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-lbl">Total</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-lbl">Done</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statLeft">0</span>
        <span class="stat-lbl">Left</span>
      </div>
    </div>
  </div>

  <div class="filters-wrap" id="filtersWrap">
    <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">All <span class="count" id="cnt-all">0</span></button>
    <button class="filter-chip" data-filter="active" onclick="setFilter('active',this)">Active <span class="count" id="cnt-active">0</span></button>
    <button class="filter-chip" data-filter="done" onclick="setFilter('done',this)">Done <span class="count" id="cnt-done">0</span></button>
    <button class="filter-chip" data-filter="high" onclick="setFilter('high',this)">🔴 High <span class="count" id="cnt-high">0</span></button>
    <button class="filter-chip" data-filter="medium" onclick="setFilter('medium',this)">🟡 Med <span class="count" id="cnt-medium">0</span></button>
    <button class="filter-chip" data-filter="low" onclick="setFilter('low',this)">🟢 Low <span class="count" id="cnt-low">0</span></button>
  </div>
</header>

<main id="main">
  <div class="add-wrap" id="addWrap">
    <input class="add-input" id="taskInput" type="text" placeholder="What needs to be done?" onkeydown="if(event.key==='Enter')addTask()" />
    <div class="add-row">
      <select class="add-select" id="prioritySelect">
        <option value="medium">🟡 Medium priority</option>
        <option value="high">🔴 High priority</option>
        <option value="low">🟢 Low priority</option>
      </select>
      <select class="add-select" id="categorySelect">
        <option value="General">General</option>
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Shopping">Shopping</option>
        <option value="Health">Health</option>
      </select>
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">✅</div>
    <div class="empty-title">All clear!</div>
    <div class="empty-sub">Tap + to add your first task</div>
  </div>

  <div id="activeSection" style="display:none">
    <div class="section-label">Active</div>
    <div class="task-list" id="activeList"></div>
  </div>

  <div id="doneSection" style="display:none">
    <div class="section-label">Completed</div>
    <div class="task-list" id="doneList"></div>
  </div>
</main>

<button class="fab" id="fab" onclick="toggleAdd()">+</button>

<script>
  // ── STATE ──────────────────────────────────────────────────────────────────
  let tasks = JSON.parse(localStorage.getItem('tf_tasks') || '[]');
  let filter = 'all';
  let nextId = parseInt(localStorage.getItem('tf_nextId') || '1');

  function save() {
    localStorage.setItem('tf_tasks', JSON.stringify(tasks));
    localStorage.setItem('tf_nextId', String(nextId));
  }

  // ── RENDER ─────────────────────────────────────────────────────────────────
  function render() {
    const active = tasks.filter(t => !t.done);
    const done = tasks.filter(t => t.done);
    const total = tasks.length;
    const doneCount = done.length;

    // Progress
    const pct = total ? Math.round((doneCount / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${doneCount} / ${total} tasks done`;
    document.getElementById('progressPct').textContent = pct + '%';

    // Stats
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent = doneCount;
    document.getElementById('statLeft').textContent = active.length;

    // Filter counts
    document.getElementById('cnt-all').textContent = total;
    document.getElementById('cnt-active').textContent = active.length;
    document.getElementById('cnt-done').textContent = doneCount;
    document.getElementById('cnt-high').textContent = tasks.filter(t=>t.priority==='high').length;
    document.getElementById('cnt-medium').textContent = tasks.filter(t=>t.priority==='medium').length;
    document.getElementById('cnt-low').textContent = tasks.filter(t=>t.priority==='low').length;

    // Filter tasks
    let filtered;
    if (filter === 'all') filtered = tasks;
    else if (filter === 'active') filtered = active;
    else if (filter === 'done') filtered = done;
    else filtered = tasks.filter(t => t.priority === filter);

    const filteredActive = filtered.filter(t => !t.done);
    const filteredDone = filtered.filter(t => t.done);

    // Render active
    const activeList = document.getElementById('activeList');
    const activeSection = document.getElementById('activeSection');
    activeList.innerHTML = filteredActive.map(t => taskHTML(t)).join('');
    activeSection.style.display = filteredActive.length ? 'block' : 'none';

    // Render done
    const doneList = document.getElementById('doneList');
    const doneSection = document.getElementById('doneSection');
    doneList.innerHTML = filteredDone.map(t => taskHTML(t)).join('');
    doneSection.style.display = filteredDone.length ? 'block' : 'none';

    // Empty state
    const empty = document.getElementById('emptyState');
    const hasAny = filteredActive.length || filteredDone.length;
    empty.className = 'empty-state' + (hasAny ? '' : ' show');
  }

  function taskHTML(t) {
    const priorityLabel = {high:'🔴 High', medium:'🟡 Med', low:'🟢 Low'}[t.priority];
    return `
      <div class="task-item${t.done?' done':''}" data-priority="${t.priority}" data-id="${t.id}">
        <input type="checkbox" class="task-cb" ${t.done?'checked':''} onchange="toggle(${t.id})" />
        <div class="task-body">
          <div class="task-text">${escHTML(t.text)}</div>
          <div class="task-meta">
            <span class="tag tag-cat">${escHTML(t.category)}</span>
            <span class="tag tag-${t.priority}">${priorityLabel}</span>
          </div>
        </div>
        <div class="task-actions">
          <button class="task-action-btn" onclick="del(${t.id})" title="Delete">✕</button>
        </div>
      </div>`;
  }

  function escHTML(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── ACTIONS ────────────────────────────────────────────────────────────────
  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const priority = document.getElementById('prioritySelect').value;
    const category = document.getElementById('categorySelect').value;
    tasks.unshift({ id: nextId++, text, priority, category, done: false });
    input.value = '';
    save(); render();
  }

  function toggle(id) {
    tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
    save(); render();
  }

  function del(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  function clearDone() {
    if (!tasks.filter(t=>t.done).length) return;
    tasks = tasks.filter(t => !t.done);
    save(); render();
  }

  // ── UI ─────────────────────────────────────────────────────────────────────
  function toggleAdd() {
    const wrap = document.getElementById('addWrap');
    const fab = document.getElementById('fab');
    const isOpen = wrap.classList.contains('open');
    wrap.classList.toggle('open');
    fab.classList.toggle('open');
    if (!isOpen) setTimeout(() => document.getElementById('taskInput').focus(), 100);
  }

  function setFilter(f, el) {
    filter = f;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  function toggleStats() {
    document.getElementById('statsPanel').classList.toggle('open');
    document.getElementById('statsBtn').classList.toggle('active');
  }

  // Scroll header shadow
  document.getElementById('main').addEventListener('scroll', e => {
    document.getElementById('header').classList.toggle('scrolled', e.target.scrollTop > 8);
  });

  // ── PWA ────────────────────────────────────────────────────────────────────
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('installBanner').style.display = 'block';
  });
  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').style.display = 'none';
      });
    }
  }

  // ── SEED DATA ──────────────────────────────────────────────────────────────
  if (!tasks.length) {
    tasks = [
      { id: nextId++, text: 'Push Calculator Pro PWA to GitHub', priority: 'high', category: 'Work', done: true },
      { id: nextId++, text: 'Enable GitHub Pages for all projects', priority: 'high', category: 'Work', done: false },
      { id: nextId++, text: 'Build SaaS Landing Page', priority: 'medium', category: 'Work', done: false },
      { id: nextId++, text: 'Add screenshots to READMEs', priority: 'low', category: 'Work', done: false },
    ];
    save();
  }

  render();
</script>
</body>
</html>
